<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ENSEMBLE – Sondages</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Barlow:wght@300;600&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1f1f24; --bg2:#2a2a31; --bg3:#3a3a44;
  --txt:#f2f2f2; --muted:#a8a8b3;
  --rose:#c2185b; --jaune:#ffd23f; --orange:#ff8c42;
  --ok:#7bd88f;
  --oui:#2e5d34; --peut:#6b5d1a; --non:#6b2a2a;
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--txt)}
h1{font-family:'Bebas Neue',sans-serif;font-weight:400;font-size:45px;margin:0;color:var(--rose);letter-spacing:1.5px;line-height:1;cursor:pointer}
header{background:var(--bg2);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:6px solid;border-image:linear-gradient(90deg,var(--rose),var(--orange),var(--jaune)) 1}
#userbox{display:flex;gap:10px;align-items:center;font-size:.85rem;color:var(--muted)}
main{max-width:900px;margin:20px auto;padding:0 14px}
footer{text-align:center;color:var(--muted);font-size:.8rem;padding:20px}
.card{background:var(--bg2);border-radius:12px;padding:18px;margin-bottom:16px;border-left:5px solid var(--rose)}
.card.jaune{border-left-color:var(--jaune)}
h2{margin:0 0 10px;color:var(--jaune)}
label{display:block;margin:10px 0 4px;font-size:.85rem;color:var(--muted)}
input,textarea{width:100%;padding:9px;border-radius:8px;border:1px solid var(--bg3);background:var(--bg);color:var(--txt);font:inherit}
input:focus,textarea:focus{outline:none;border-color:var(--jaune)}
button{background:var(--rose);color:#fff;border:0;border-radius:8px;padding:9px 14px;font:inherit;cursor:pointer;font-weight:600}
button:hover{filter:brightness(1.1)}
button:disabled{opacity:.5;cursor:wait}
button.jaune{background:var(--jaune);color:#222}
button.sec{background:var(--bg3);color:var(--muted)}
button.sec.on,button.sec.jaune{color:#222}
button.danger{background:transparent;color:#ff6b6b;border:2px solid #ff6b6b;padding:6px 10px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.row>div{flex:1;min-width:180px}
.boutons-duo{display:flex;gap:10px}
.boutons-duo button{flex:1}
.muted{color:var(--muted);font-size:.85rem}
.tag{background:var(--orange);color:#222;border-radius:6px;padding:1px 7px;font-size:.75rem}
.opt{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.opt input{flex:1;min-width:0}
.opt button{flex:0 0 auto}
.lienbox{display:flex;gap:8px}
.lienbox input{flex:1}

/* Choix de vote */
.choix{display:flex;gap:6px}
.choix button{background:var(--bg3);color:var(--txt);flex:1}
.choix button.sel.oui{background:#2e8b3d}
.choix button.sel.peut{background:#c9a21a;color:#222}
.choix button.sel.non{background:#b03a3a}

/* Tableau des réponses : identique créateur et lecteur */
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{border:1px solid var(--bg3);padding:8px;text-align:center}
th{background:var(--bg3)}
td:first-child,th:first-child{text-align:left;font-weight:600}
td.oui{background:var(--oui)}
td.peut{background:var(--peut)}
td.non{background:var(--non)}
td.att{color:var(--muted)}

/* Mise en évidence : seulement entête + total, jamais les choix */
th.gagnant,td.gagnant{background:rgba(123,216,143,.18);color:var(--ok);box-shadow:inset 0 -3px 0 var(--ok)}
th.egalite,td.egalite{background:rgba(255,210,63,.16);color:var(--jaune);box-shadow:inset 0 -3px 0 var(--jaune)}
tr.total td{font-weight:800;border-top:2px solid var(--orange)}

/* Bandeau unique au-dessus du tableau */
.bandeau{padding:12px 14px;border-radius:10px;margin:12px 0;font-weight:600}
.bandeau.ok{background:rgba(123,216,143,.15);border:1px solid var(--ok);color:var(--ok)}
.bandeau.eg{background:rgba(255,210,63,.15);border:1px solid var(--jaune);color:var(--jaune)}
.bandeau.vide{background:var(--bg3);color:var(--muted);border:1px solid var(--bg3)}

#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--bg3);padding:10px 16px;border-radius:8px;display:none;z-index:9}
#toast.err{background:#b03a3a}

@media print{
  body{background:#fff;color:#000}
  header,.noprint,footer{display:none!important}
  .card{background:#fff;border:1px solid #999}
  h2{color:#000}
  th{background:#eee;color:#000}
  td.oui{background:#cfeccf;color:#000}
  td.peut{background:#fff3b0;color:#000}
  td.non{background:#f5c6c6;color:#000}
  th.gagnant,td.gagnant,th.egalite,td.egalite{background:#fff;color:#000}
}
</style>
</head>
<body>
<header><h1 onclick="goHome()">📅 Ensemble</h1><div id="userbox"></div></header>
<main id="app"></main>
<footer>Gratuit · Sans pub · Sur invitation seulement</footer>
<div id="toast"></div>

<script>
/* ================= CONFIG ================= */
const CONFIG = {
  AUTH_URL: 'https://ep-odd-glitter-bdbk5ee1.neonauth.c-8.us-east-2.aws.neon.tech/neondb/auth',
  DATA_API_URL: 'https://ep-odd-glitter-bdbk5ee1.apirest.c-8.us-east-2.aws.neon.tech/neondb/rest/v1',
  INVITE_EMAIL: 'invite@ensemble.app',
  INVITE_PASSWORD: '12345678'
};

/* ================= Outils ================= */
const $ = s => document.querySelector(s);
const app = $('#app');
const esc = s => { const d=document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; };
const base = () => location.origin + location.pathname;
const VAL = {oui:'✔', peut:'?', non:'✘'};
const lienVote = id => `${base()}?v=${id}`;
const lienLecture = id => `${base()}?r=${id}`;
function toast(m, err){ const t=$('#toast'); t.textContent=m; t.className=err?'err':''; t.style.display='block'; setTimeout(()=>t.style.display='none',3500); }
function goHome(){ location.href = base(); }
function libelle(kind, label){
  if(kind==='dates'){ const d=new Date(label); if(!isNaN(d)) return d.toLocaleString('fr-CA',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}); }
  return label;
}
function copierChamp(id,btn){
  const champ=document.getElementById(id);
  navigator.clipboard.writeText(champ.value).catch(()=>{champ.select();document.execCommand('copy');});
  const t=btn.textContent; btn.textContent='Copié ✓'; setTimeout(()=>btn.textContent=t,1800);
}

/* ================= Analyse commune (créateur et lecteur) ================= */
function normAns(a){ return (a==='peut-etre'||a==='peut-être') ? 'peut' : a; }

/* Regroupe les réponses par participant */
function participantsDe(options, rows){
  // rows : [{nom, option_id, answer}]
  const map = new Map();
  rows.forEach(r=>{
    if(!map.has(r.nom)) map.set(r.nom, {nom:r.nom, rep:{}});
    map.get(r.nom).rep[r.option_id] = normAns(r.answer);
  });
  return [...map.values()];
}

/* Score par option : oui = 2 points, peut = 1 point */
function statsDe(options, P){
  return options.map(o=>{
    let oui=0,peut=0,non=0;
    P.forEach(p=>{
      const a=p.rep[o.id];
      if(a==='oui')oui++; else if(a==='peut')peut++; else if(a==='non')non++;
    });
    return {oui,peut,non,score:oui*2+peut};
  });
}

/* Détermine gagnant / égalité / vide */
function classer(st){
  const max=Math.max(0,...st.map(x=>x.score));
  const tops=st.map((x,i)=>max>0&&x.score===max?i:-1).filter(i=>i>=0);
  const etat = max===0 ? 'vide' : (tops.length>1 ? 'egalite' : 'gagnant');
  return {max,tops,etat,cls:st.map((_,i)=>tops.includes(i)?etat:'')};
}

/* Bandeau unique, utilisé par les deux vues */
function bandeauDe(c, options, kind){
  if(c.etat==='vide') return '<div class="bandeau vide">Aucune réponse pour l’instant.</div>';
  const noms = c.tops.map(i=>esc(libelle(kind,options[i].label))).join(' · ');
  if(c.etat==='gagnant') return `<div class="bandeau ok">🏆 Option gagnante : <b>${noms}</b></div>`;
  return `<div class="bandeau eg">⚖️ Égalité, résultat pas encore évident : <b>${noms}</b></div>`;
}

/* Tableau unique, utilisé par les deux vues */
function tableauDe(options, kind, P, st, c){
  const entete = options.map((o,i)=>
    `<th class="${c.cls[i]}">${esc(libelle(kind,o.label))}${c.etat==='gagnant'&&c.cls[i]?' 🏆':''}</th>`).join('');
  const lignes = P.length ? P.map(p=>`<tr>
      <td>${esc(p.nom)}</td>
      ${options.map(o=>{
        const a=p.rep[o.id];
        return `<td class="${a||'att'}">${a?VAL[a]:'—'}</td>`;
      }).join('')}
    </tr>`).join('')
    : `<tr><td colspan="${options.length+1}" class="muted">Aucune réponse pour l'instant.</td></tr>`;
  const total = st.map((x,i)=>
    `<td class="${c.cls[i]}">${x.oui} / ${x.peut} / ${x.non}</td>`).join('');
  return `<div class="table-wrap"><table>
    <tr><th>Participant</th>${entete}</tr>
    ${lignes}
    <tr class="total"><td>Total (✔ / ? / ✘)</td>${total}</tr>
  </table></div>`;
}

/* ================= Auth ================= */
const Auth = {
  user:null, jwt:null, jwtExp:0,
  async call(path, opts={}){
    const r = await fetch(CONFIG.AUTH_URL + path, {
      credentials:'include',
      headers:{'Content-Type':'application/json'},
      ...opts
    });
    const txt = await r.text(); let data=null; try{ data=JSON.parse(txt); }catch{}
    if(!r.ok) throw new Error((data&&(data.message||data.error))||('Erreur auth '+r.status));
    return data;
  },
  signUp(name,email,password){ return this.call('/sign-up/email',{method:'POST',body:JSON.stringify({name,email,password})}); },
  signIn(email,password){ return this.call('/sign-in/email',{method:'POST',body:JSON.stringify({email,password})}); },
  async signOut(){ try{ await this.call('/sign-out',{method:'POST',body:'{}'}); }catch{} this.user=null; this.jwt=null; },
  async refresh(){
    try{ const s = await this.call('/get-session'); this.user = s && s.user ? s.user : null; }
    catch{ this.user=null; }
    return this.user;
  },
  async getToken(force){
    if(!force && this.jwt && Date.now() < this.jwtExp) return this.jwt;
    let tok=null;
    try{ const d = await this.call('/token'); tok = d && (d.token || d.jwt); }catch{}
    if(!tok){
      const r = await fetch(CONFIG.AUTH_URL + '/get-session', {credentials:'include'});
      tok = r.headers.get('set-auth-jwt');
    }
    if(!tok) throw new Error('Jeton introuvable : reconnectez-vous');
    this.jwt = tok; this.jwtExp = Date.now() + 10*60*1000;
    return tok;
  }
};

/* ================= Data API ================= */
let GUEST_JWT=null, GUEST_EXP=0;
async function guestToken(){
  if(GUEST_JWT && Date.now()<GUEST_EXP) return GUEST_JWT;
  await Auth.signIn(CONFIG.INVITE_EMAIL, CONFIG.INVITE_PASSWORD).catch(()=>{});
  const t = await Auth.getToken(true);
  GUEST_JWT=t; GUEST_EXP=Date.now()+10*60*1000;
  return t;
}
async function api(path, {method='GET', body=null, guest=false} = {}){
  const token = guest ? await guestToken() : await Auth.getToken();
  const r = await fetch(CONFIG.DATA_API_URL + path, {
    method,
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
    ...(body===null ? {} : {body:JSON.stringify(body)})
  });
  const txt = await r.text(); let data=null; try{ data=JSON.parse(txt); }catch{}
  if(!r.ok) throw new Error((data&&(data.message||data.details||data.hint||data.error))||('Erreur API '+r.status));
  return data;
}
const rpc = (fn,args,guest) => api('/rpc/'+fn,{method:'POST',body:args,guest});

/* ================= Rafraîchissement automatique ================= */
const REFRESH_MS = 10000;
let TIMER=null, AUTO=false, AUTO_FN=null;
function arreterAuto(){ if(TIMER){ clearInterval(TIMER); TIMER=null; } }
function appliquerAuto(){
  arreterAuto();
  if(AUTO && AUTO_FN) TIMER=setInterval(()=>{ if(!document.hidden) AUTO_FN(); }, REFRESH_MS);
  document.querySelectorAll('.btnAuto').forEach(b=>{
    b.textContent = AUTO ? '⏸ Actualisation auto : activée' : '▶ Actualisation auto : désactivée';
    b.className = 'btnAuto ' + (AUTO ? 'jaune' : 'sec');
  });
}
function basculerAuto(){ AUTO=!AUTO; appliquerAuto(); }
function definirAuto(fn){ AUTO_FN=fn; appliquerAuto(); }
function rafraichir(){ if(AUTO_FN) AUTO_FN(); }

/* ================= Routage ================= */
async function route(){
  const p = new URLSearchParams(location.search);
  if(p.get('v')) return vueVote(p.get('v'));
  if(p.get('r')) return vueLecture(p.get('r'));
  await Auth.refresh();
  renderUserBox();
  if(!Auth.user || Auth.user.email===CONFIG.INVITE_EMAIL) return vueConnexion();
  if(p.get('p')) return vueResultats(p.get('p'));
  return vueAccueil();
}
function renderUserBox(){
  $('#userbox').innerHTML = Auth.user && Auth.user.email!==CONFIG.INVITE_EMAIL
    ? `<span>${esc(Auth.user.email)}</span><button class="sec" onclick="deconnexion()">Déconnexion</button>` : '';
}
async function deconnexion(){ await Auth.signOut(); goHome(); }

/* ================= Connexion ================= */
let authMode='in';
function vueConnexion(){
  app.innerHTML = `<div class="card"><h2>${authMode==='in'?'Connexion':'Créer un compte'}</h2>
    <p class="muted">Pour <b>créer</b> des sondages. Les invités votent sans compte.</p>
    ${authMode==='up'?'<label>Nom</label><input id="aNom">':''}
    <label>Courriel</label><input id="aEmail" type="email" autocomplete="email">
    <label>Mot de passe</label><input id="aPass" type="password" autocomplete="current-password">
    <div class="row" style="margin-top:14px">
      <button id="aBtn" onclick="soumettreAuth()">${authMode==='in'?'Se connecter':'Créer mon compte'}</button>
      <button class="sec" onclick="authMode=authMode==='in'?'up':'in';vueConnexion()">${authMode==='in'?'Créer un compte':"J'ai déjà un compte"}</button>
    </div></div>`;
}
async function soumettreAuth(){
  const email=$('#aEmail').value.trim(), pass=$('#aPass').value;
  const btn=$('#aBtn'); btn.disabled=true;
  try{
    if(authMode==='up'){ await Auth.signUp(($('#aNom').value.trim()||email.split('@')[0]),email,pass); }
    else { await Auth.signIn(email,pass); }
    await route();
  }catch(e){ toast(e.message,true); btn.disabled=false; }
}

/* ================= Accueil : création ================= */
let mode='dates';
async function vueAccueil(){
  app.innerHTML = `<div class="card"><h2>Créer un sondage</h2>
    <label>Titre</label><input id="titre" placeholder="Ex. : Souper d'équipe">
    <label>Description (facultatif)</label><textarea id="desc" rows="2"></textarea>
    <div class="row">
      <div><label>Votre nom</label><input id="auteur" value="${esc(Auth.user.name||'')}"></div>
      <div><label>Votre courriel</label><input id="courriel" type="email" value="${esc(Auth.user.email||'')}"></div>
    </div>

    <label>Type d'options</label>
    <div class="boutons-duo">
      <button type="button" id="mDates" class="sec" onclick="setMode('dates')">📅 Dates</button>
      <button type="button" id="mTexte" class="sec" onclick="setMode('texte')">📝 Texte libre</button>
    </div>
    <div id="options" style="margin-top:8px"></div>
    <button type="button" class="jaune" onclick="addOpt()" style="margin-top:8px">+ Ajouter une option</button>

    <label>Mot de passe pour voter</label>
    <input id="motMagique" autocomplete="off" placeholder="ex. : souper2026">
    <label>Mot de passe pour lecture seule (voir les résultats)</label>
    <input id="motLecture" autocomplete="off" placeholder="ex. : resultats2026">

    <button id="btnCreer" type="button" onclick="creer()" style="margin-top:14px">Créer le sondage ➜</button>
  </div>
  <div class="card jaune" id="mesSondages"><h2>Mes sondages</h2><p class="muted">Chargement…</p></div>`;

  setMode(mode);
  try{
    const polls = await api('/polls?select=id,title,created_at,closed&order=created_at.desc');
    $('#mesSondages').innerHTML = '<h2>Mes sondages</h2>' + (polls.length ? polls.map(s=>`
      <div class="row" style="padding:8px 0;border-bottom:1px solid var(--bg3)">
        <div><b>${esc(s.title)}</b> ${s.closed?'<span class="tag">fermé</span>':''}
          <div class="muted">${new Date(s.created_at).toLocaleDateString('fr-CA')}</div></div>
        <button class="jaune" onclick="location.search='?p=${s.id}'">Ouvrir</button>
        <button class="danger" onclick="supprimer('${s.id}')">Supprimer</button>
      </div>`).join('') : '<p class="muted">Aucun sondage pour l\'instant.</p>');
  }catch(e){ toast(e.message,true); }
}
function setMode(m){
  mode = m;
  $('#mDates').classList.toggle('on', m==='dates');
  $('#mTexte').classList.toggle('on', m==='texte');
  $('#options').innerHTML = '';
  addOpt(); addOpt();
}
function addOpt(){
  const d = document.createElement('div');
  d.className = 'opt';
  d.innerHTML =
    (mode==='dates'
      ? '<input type="datetime-local" class="o">'
      : '<input type="text" class="o" placeholder="Option">')
    + '<button type="button" class="danger" onclick="this.parentNode.remove()">✕</button>';
  $('#options').appendChild(d);
}
async function creer(){
  try{
    const val = id => { const el=document.getElementById(id); if(!el) throw new Error('Champ introuvable : #'+id); return el.value.trim(); };
    const titre=val('titre'), auteur=val('auteur'), courriel=val('courriel');
    const magique=val('motMagique'), lecture=val('motLecture');
    const options=[...document.querySelectorAll('#options .opt input')].map(i=>i.value.trim()).filter(Boolean);

    if(!titre||!auteur||!courriel) return toast('Titre, nom et courriel requis',true);
    if(options.length<2) return toast('Au moins 2 options',true);
    if(magique.length<3) return toast('Mot de passe de vote : 3 caractères minimum',true);
    if(lecture.length<3) return toast('Mot de passe de lecture : 3 caractères minimum',true);

    const btn=$('#btnCreer'); btn.disabled=true;
    try{
      const res = await rpc('create_poll',{
        p_title:titre, p_description:val('desc'), p_kind:mode,
        p_creator_name:auteur, p_creator_email:courriel,
        p_options:options, p_magic_word:magique, p_read_word:lecture
      });
      location.search='?p='+res.id;
    }catch(e){ toast(e.message,true); btn.disabled=false; }
  }catch(e){ toast(e.message,true); }
}
async function supprimer(id){
  if(!confirm('Supprimer ce sondage et toutes ses réponses ?')) return;
  try{ await api('/polls?id=eq.'+id,{method:'DELETE'}); vueAccueil(); }catch(e){ toast(e.message,true); }
}

/* ================= Vue créateur ================= */
let CUR=null;
async function vueResultats(id, silencieux){
  if(!silencieux) app.innerHTML='<div class="card"><p class="muted">Chargement…</p></div>';
  try{
    const sel='id,title,description,kind,magic_word,read_word,closed,poll_options(id,label,position),invitations(id,email,responses(option_id,answer,participant_name))';
    const rows = await api(`/polls?id=eq.${id}&select=${encodeURIComponent(sel)}`);
    if(!rows.length){ app.innerHTML='<div class="card"><h2>Introuvable</h2><button onclick="goHome()">Retour</button></div>'; return; }
    CUR=rows[0];
    CUR.poll_options.sort((a,b)=>a.position-b.position);
    rendreResultats();
    if(!silencieux) definirAuto(()=>vueResultats(id,true));
  }catch(e){ if(!silencieux) toast(e.message,true); }
}

function rendreResultats(){
  const s=CUR;
  // Aplatit les réponses de tous les invités
  const rows=[];
  s.invitations.forEach(inv=>inv.responses.forEach(r=>{
    rows.push({nom:(r.participant_name||'').trim()||inv.email, option_id:r.option_id, answer:r.answer});
  }));
  const P = participantsDe(s.poll_options, rows);
  const st = statsDe(s.poll_options, P);
  const c = classer(st);

  app.innerHTML = `
  <div class="card">
    <h2>${esc(s.title)} ${s.closed?'<span class="tag">fermé</span>':''}</h2>
    <p class="muted">${esc(s.description||'')}</p>
    <p><b style="color:var(--rose)">${P.length}</b> réponse(s)</p>

    <div class="noprint">
      <label>Lien de vote (à envoyer aux invités, mot de passe de vote requis)</label>
      <div class="lienbox">
        <input id="lienChamp" readonly value="${esc(lienVote(s.id))}" onclick="this.select()">
        <button class="sec" onclick="copierChamp('lienChamp',this)">Copier</button>
      </div>
      <label>Lien de lecture seule (mot de passe de lecture requis)</label>
      <div class="lienbox">
        <input id="lienLect" readonly value="${esc(lienLecture(s.id))}" onclick="this.select()">
        <button class="sec" onclick="copierChamp('lienLect',this)">Copier</button>
      </div>
    </div>

    <div class="row noprint" style="margin-top:16px">
      <button class="jaune" onclick="partager()">🔗 Partager</button>
      <button class="sec" onclick="window.print()">🖨 Imprimer</button>
      <button class="sec" onclick="exportCSV()">⬇ Exporter CSV</button>
      <button class="sec" onclick="basculerFerme()">${s.closed?'🔓 Rouvrir':'🔒 Fermer'}</button>
      <button class="sec" onclick="rafraichir()">⟳ Actualiser</button>
      <button class="btnAuto sec" onclick="basculerAuto()"></button>
    </div>
  </div>

  <div class="card jaune">
    ${bandeauDe(c, s.poll_options, s.kind)}
    ${tableauDe(s.poll_options, s.kind, P, st, c)}
  </div>

  <div class="noprint"><button class="sec" onclick="goHome()">← Retour</button></div>`;

  appliquerAuto();
}

async function basculerFerme(){
  try{ await api('/polls?id=eq.'+CUR.id,{method:'PATCH',body:{closed:!CUR.closed}}); vueResultats(CUR.id); }catch(e){ toast(e.message,true); }
}
function partager(){
  const txt=`${CUR.title}\nVotez ici : ${lienVote(CUR.id)}\nMot de passe de vote : ${CUR.magic_word}`;
  if(navigator.share) navigator.share({title:CUR.title,text:txt}).catch(()=>{});
  else navigator.clipboard.writeText(txt).then(()=>toast('Message copié'));
}
function exportCSV(){
  const s=CUR, q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const M={oui:'Oui',peut:'Peut-être',non:'Non'};
  const rows=[];
  s.invitations.forEach(inv=>inv.responses.forEach(r=>{
    rows.push({nom:(r.participant_name||'').trim()||inv.email, option_id:r.option_id, answer:r.answer});
  }));
  const P=participantsDe(s.poll_options, rows);
  const st=statsDe(s.poll_options, P);
  const L=[['Participant',...s.poll_options.map(o=>libelle(s.kind,o.label))]];
  P.forEach(p=>L.push([p.nom,...s.poll_options.map(o=>M[p.rep[o.id]]||'')]));
  L.push(['Total Oui',...st.map(x=>x.oui)],['Total Peut-être',...st.map(x=>x.peut)],['Total Non',...st.map(x=>x.non)]);
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['\ufeff'+L.map(l=>l.map(q).join(',')).join('\n')],{type:'text/csv;charset=utf-8'}));
  a.download=s.title.replace(/\W+/g,'_')+'.csv'; a.click();
}

/* ================= Vue lecteur (lecture seule) ================= */
let LECT_ID='', LECT_WORD='';
function vueLecture(pollId){
  LECT_ID=pollId; AUTO=false; AUTO_FN=null; arreterAuto();
  app.innerHTML=`<div class="card"><h2>Résultats du sondage</h2>
    <label>Mot de passe de lecture</label><input id="motL" autocomplete="off">
    <div style="margin-top:14px"><button id="btnL" onclick="ouvrirLecture()">Voir les résultats</button></div></div>`;
}
async function ouvrirLecture(){
  LECT_WORD=$('#motL').value.trim();
  if(!LECT_WORD) return toast('Entrez le mot de passe de lecture',true);
  try{
    await chargerLecture();
    definirAuto(()=>chargerLecture(true));
  }catch(e){ toast(e.message,true); }
}
async function chargerLecture(silencieux){
  try{
    const d = await rpc('get_results_public',{p_poll_id:LECT_ID,p_word:LECT_WORD},true);
    rendreLecture(d);
  }catch(e){ if(!silencieux) throw e; }
}
function rendreLecture(d){
  // d.responses : [{invitation_id, participant_name, option_id, answer}]
  const rows=d.responses.map(r=>({nom:(r.participant_name||'').trim()||'Anonyme', option_id:r.option_id, answer:r.answer}));
  const P = participantsDe(d.options, rows);
  const st = statsDe(d.options, P);
  const c = classer(st);

  app.innerHTML=`
  <div class="card">
    <h2>${esc(d.title)} ${d.closed?'<span class="tag">fermé</span>':''}</h2>
    <p class="muted">${esc(d.description||'')}</p>
    <p><b style="color:var(--rose)">${P.length}</b> réponse(s) · lecture seule</p>
    <div class="row noprint" style="margin-top:12px">
      <button class="btnAuto sec" onclick="basculerAuto()"></button>
      <button class="sec" onclick="rafraichir()">⟳ Actualiser maintenant</button>
    </div>
  </div>

  <div class="card jaune">
    ${bandeauDe(c, d.options, d.kind)}
    ${tableauDe(d.options, d.kind, P, st, c)}
  </div>`;

  appliquerAuto();
}

/* ================= Vue vote (invités) ================= */
let choix={}, VOTE=null, VOTE_ID='', VOTE_WORD='';
function vueVote(pollId){
  VOTE_ID=pollId; choix={};
  app.innerHTML=`<div class="card"><h2>Accès au sondage</h2>
    <label>Mot de passe de vote</label><input id="mot" autocomplete="off">
    <div style="margin-top:14px"><button id="btnMot" onclick="ouvrirSondage()">Entrer</button></div></div>`;
}
async function ouvrirSondage(){
  VOTE_WORD=$('#mot').value.trim();
  if(!VOTE_WORD) return toast('Entrez le mot de passe de vote',true);
  const btn=$('#btnMot'); btn.disabled=true;
  try{
    VOTE = await rpc('get_poll_public',{p_poll_id:VOTE_ID,p_word:VOTE_WORD},true);
    afficherVote();
  }catch(e){ toast(e.message,true); btn.disabled=false; }
}
function afficherVote(){
  const v=VOTE;
  app.innerHTML=`<div class="card"><h2>${esc(v.title)}</h2>
    <p class="muted">${esc(v.description)} — par ${esc(v.creator_name)}</p>
    ${v.closed?'<p><span class="tag">Sondage fermé</span></p>':''}
    <label>Votre nom</label><input id="rNom" ${v.closed?'disabled':''}>
    ${v.options.map(o=>`<div style="margin-top:14px"><b>${esc(libelle(v.kind,o.label))}</b>
      <div class="choix" data-o="${o.id}">
        <button data-v="oui">✔ Oui</button><button data-v="peut">? Peut-être</button><button data-v="non">✘ Non</button>
      </div></div>`).join('')}
    ${v.closed?'':'<div style="margin-top:18px"><button id="btnRep" onclick="envoyerReponse()">Envoyer ma réponse</button></div>'}
  </div>`;
  document.querySelectorAll('.choix button').forEach(b=>b.onclick=()=>{
    if(v.closed) return;
    const o=b.parentNode.dataset.o; choix[o]=b.dataset.v;
    b.parentNode.querySelectorAll('button').forEach(x=>x.className='');
    b.className='sel '+b.dataset.v;
  });
}
async function envoyerReponse(){
  const nom=$('#rNom').value.trim();
  if(!nom) return toast('Entrez votre nom',true);
  if(Object.keys(choix).length<VOTE.options.length) return toast('Répondez à chaque option',true);
  const answers=Object.entries(choix).map(([option_id,answer])=>({option_id,answer}));
  const btn=$('#btnRep'); btn.disabled=true;
  try{
    await rpc('submit_response',{p_poll_id:VOTE_ID,p_word:VOTE_WORD,p_name:nom,p_answers:answers},true);
    app.innerHTML='<div class="card"><h2>✅ Merci !</h2><p>Votre réponse est enregistrée.</p></div>';
  }catch(e){ toast(e.message,true); btn.disabled=false; }
}

/* ================= Démarrage ================= */
route();
</script>
